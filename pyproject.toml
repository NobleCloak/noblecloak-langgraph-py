[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "noblecloak-langgraph"
version = "0.0.0"
description = "Approvals for LangGraph (Python): decide, pause, verify, resume."
readme = "README.md"
license = "Apache-2.0"
authors = [{ name = "NobleCloak" }]
requires-python = ">=3.12"
dependencies = []
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Repository = "https://github.com/NobleCloak/noblecloak-langgraph-py"

[tool.hatch.build.targets.wheel]
packages = ["src/noblecloak_langgraph"]
